<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>
    const requestedPath =
      window.location.pathname +
      window.location.search +
      window.location.hash;

    window.location.replace(
      `${window.location.origin}/?p=${encodeURIComponent(requestedPath)}`,
    );
  </script>
</head>
<body>
</body>
</html>
