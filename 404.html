  <head>
    <meta charset="UTF-8" />

    <script>
      const base = "/FabianaEstetica";
      const path = window.location.pathname;

      // evita loop infinito
      if (path === base || path === base + "/") {
        window.location.replace(base + "/");
      } else {
        window.location.replace(base + "/");
      }
    </script>
  </head>

</html>
