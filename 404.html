<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />

    <script>
      // pega a URL inteira
      const path = window.location.pathname;

      // se não estiver na pasta correta, manda pra base
      if (!path.includes("/FabianaEstetica")) {
        window.location.replace("/FabianaEstetica/");
      } else {
        window.location.replace(path);
      }
    </script>
  </head>
  <body></body>
</html>
