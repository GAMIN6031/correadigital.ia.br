<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>
    // pega a URL completa
    const path = window.location.pathname;

    // se o usuário tentou acessar /FabianaEstetica
    if (path.startsWith("/FabianaEstetica")) {
      // transforma em hash router
      window.location.replace("/#/FabianaEstetica" + window.location.search + window.location.hash);
    } else {
      // fallback genérico: manda para home com hash
      window.location.replace("/#/");
    }
  </script>
</head>
<body>
</body>
</html>
